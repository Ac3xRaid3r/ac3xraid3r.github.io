name: Rebuild search index

# Runs on every push to main. If any .html file changed, rebuilds
# search-index.json and commits it back if the new index is different.
# The commit uses [skip ci] so it does not re-trigger this workflow.

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "build-search-index.py"
      - ".github/workflows/search-index.yml"

permissions:
  contents: write

concurrency:
  group: search-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # Guard against the workflow's own commit re-triggering it. The paths
    # filter above already excludes pure index updates, but this gives a
    # second line of defence if someone edits a page in the same commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Fetch enough history for a diff-aware push; shallow is fine.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Rebuild search index
        run: python3 build-search-index.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- search-index.json; then
            echo "search-index.json is up to date; no commit needed"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-index.json
          git commit -m "chore(search): rebuild index [skip ci]"
          git push
